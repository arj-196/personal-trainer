services:
  trainer-api:
    image: ${TRAINER_IMAGE}:${TRAINER_IMAGE_TAG}
    container_name: personal-trainer-api
    env_file:
      - /home/github/prod/personal-trainer/.env
    ports:
      - "127.0.0.1:8010:8010"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
